{% extends 'base.html' %}

{% block content %}
<h2>🛒 Shopping Cart</h2>

<table class="table">
    <thead>
        <tr>
            <th>Book</th>
            <th>Qty</th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.book.title }}</td>
            <td>{{ item.quantity }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">Cart is empty</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
